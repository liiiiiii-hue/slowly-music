name: Publish signed APK
on:
  create:
  push:
    branches: ['release-assets/v0.5.0']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-apk-v0.5.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/release-assets/v0.5.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the locally signed APK
        env:
          APK_SHA256: 9b3c401a014a1e2218ad2f836b19c744e3a3abcffa2c69118a45fe630b89f79e
        run: |
          mkdir -p dist
          cat .release/parts/part* > dist/SlowlyMusic-0.5.0.apk
          printf '%s  %s\n' "$APK_SHA256" dist/SlowlyMusic-0.5.0.apk | sha256sum --check
          cd dist
          sha256sum SlowlyMusic-0.5.0.apk > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.5.0 > /dev/null 2>&1; then
            echo "Release already exists; verifying its assets."
          else
            gh release create v0.5.0 dist/SlowlyMusic-0.5.0.apk dist/SHA256SUMS.txt --target b0d8a1ed42d17236e654fa971370a0dcf3468a73 --title "Slowly Music 0.5.0 · 后台播放修复" --notes-file .release/NOTES.md
          fi
          gh release view v0.5.0 --json assets --jq '[.assets[].name] | contains(["SlowlyMusic-0.5.0.apk", "SHA256SUMS.txt"])' | grep -qx true
